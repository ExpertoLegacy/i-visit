<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b1120" />
  <title>Change password · Guard House</title>
  <link rel="icon" href="/icons/icon-192.png" />
  <link rel="stylesheet" href="/app.css" />
</head>
<body>
  <main class="auth-wrap">
    <section class="auth-card">
      <div class="auth-head">
        <div class="dot"></div>
        <div>
          <h1>Change password</h1>
          <p id="intro">Choose a new password for your account.</p>
        </div>
      </div>
      <form class="auth-form" id="passwordForm">
        <label class="field">
          <span>Current password</span>
          <input class="input" id="current" type="password" autocomplete="current-password" required />
        </label>
        <label class="field">
          <span>New password</span>
          <input class="input" id="next" type="password" autocomplete="new-password" minlength="8" required />
        </label>
        <label class="field">
          <span>Repeat new password</span>
          <input class="input" id="repeat" type="password" autocomplete="new-password" minlength="8" required />
        </label>
        <p class="form-error" id="formError"></p>
        <button class="btn btn-primary btn-block" type="submit" id="submitBtn">Save password</button>
      </form>
      <p class="auth-foot"><button class="btn btn-ghost btn-sm" id="backBtn" type="button">Back</button> <button class="btn btn-ghost btn-sm" id="logoutBtn" type="button">Sign out</button></p>
    </section>
  </main>
  <script type="module" src="/js/change-password.js"></script>
</body>
</html>
